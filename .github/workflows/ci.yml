name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    # A throwaway Postgres for migrations and the e2e suite. A fresh database is
    # exactly what surfaces bugs a long-lived local one can hide.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret-32
      NODE_ENV: test

    # Lint, format, typecheck and audit run locally (pre-commit hook +
    # `pnpm ci:local`); CI just proves it builds and the tests pass on a clean DB.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm prisma generate && pnpm build

      - name: Test
        run: pnpm prisma migrate deploy && pnpm test && pnpm test:e2e
