version: 2
updates:
  # Keep GitHub Actions versions valid and current — closes the class of
  # "action version no longer exists" failures.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # Keep npm dependencies patched. Minor/patch bumps are grouped to cut noise;
  # majors come as individual PRs so they get a proper review.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
