name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    # A throwaway Postgres for migrations and the e2e suite, matching the version
    # we run in production.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret-32
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json's "packageManager" field; specifying it
      # here too would conflict (ERR_PNPM_BAD_PM_VERSION).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fail on known high-severity vulnerabilities in production dependencies.
      - name: Audit dependencies
        run: pnpm audit --prod --audit-level high

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Lint
        run: pnpm lint:check

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Apply migrations
        run: pnpm prisma migrate deploy

      # Fails if schema.prisma has changes that no migration captures — i.e.
      # someone edited the model but forgot to generate a migration.
      - name: Check migrations are in sync with the schema
        run: >-
          pnpm prisma migrate diff
          --exit-code
          --from-url "$DATABASE_URL"
          --to-schema-datamodel ./prisma/schema.prisma

      - name: Unit tests
        run: pnpm test

      - name: E2E tests
        run: pnpm test:e2e

  # Builds the production image and scans it for OS/library vulnerabilities.
  # Only on PRs and main pushes — the image build is slow and not worth running
  # on every dev push.
  image-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t saas-api:ci .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: saas-api:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
