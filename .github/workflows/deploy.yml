name: Deploy

# Fully CI-driven deploy, no external registry. On push to main:
#   1. build the backend image in CI
#   2. save it to a tarball and copy it (+ compose/Caddyfile) to the server
#   3. SSH in: load the image, generate .env once, roll the stack
# The server only needs Docker + the deploy public key in authorized_keys.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time; a new push waits rather than racing on the server.
concurrency:
  group: deploy-omniport
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: omniport-api:latest

      - name: Save image to a tarball
        run: docker save omniport-api:latest | gzip > deploy/image.tar.gz

      - name: Copy image + config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "deploy/docker-compose.yml,deploy/Caddyfile,deploy/image.tar.gz"
          target: "/opt/omniport"
          strip_components: 1

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: R2_ENDPOINT,R2_BUCKET,R2_ACCESS_KEY_ID,R2_SECRET_ACCESS_KEY,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,POSTGRES_PASSWORD,JWT_ACCESS_SECRET
          script: |
            set -e
            if ! command -v openssl >/dev/null; then apt-get update -qq && apt-get install -y -qq openssl; fi
            cd /opt/omniport
            # Load the freshly-transferred image, then drop the tarball.
            docker load -i image.tar.gz && rm -f image.tar.gz
            mkdir -p www
            # DB password + JWT secret come from GitHub Secrets (so they match
            # your local .env.production). Fall back to the existing .env, then to
            # a generated value, if the secrets aren't set. The db volume is
            # initialised with the password, so it must stay stable once the DB
            # exists — don't change POSTGRES_PASSWORD after the first deploy.
            DBPASS="${POSTGRES_PASSWORD:-}"
            JWT="${JWT_ACCESS_SECRET:-}"
            if [ -z "$DBPASS" ] && [ -f .env ]; then DBPASS=$(grep '^POSTGRES_PASSWORD=' .env | cut -d= -f2-); fi
            if [ -z "$JWT" ] && [ -f .env ]; then JWT=$(grep '^JWT_ACCESS_SECRET=' .env | cut -d= -f2-); fi
            DBPASS=${DBPASS:-$(openssl rand -hex 16)}
            JWT=${JWT:-$(openssl rand -base64 48 | tr -d '\n')}
            # Only non-default values; everything omitted uses the schema default
            # in env.validation.ts. POSTGRES_PASSWORD is for the db container (the
            # app schema ignores unknown keys).
            cat > .env <<EOF
            NODE_ENV=production
            DATABASE_URL=postgresql://app:${DBPASS}@db:5432/app?schema=public
            POSTGRES_PASSWORD=${DBPASS}
            JWT_ACCESS_SECRET=${JWT}
            TRUST_PROXY=1
            CORS_ORIGINS=https://omniport.online,https://www.omniport.online
            EOF
            # R2 object storage — written only when configured. An empty
            # STORAGE_ENDPOINT would fail URL validation; omitting it entirely
            # just leaves file uploads disabled and the app boots fine.
            if [ -n "$R2_ENDPOINT" ]; then
              cat >> .env <<EOF
            STORAGE_ENDPOINT=${R2_ENDPOINT}
            STORAGE_BUCKET=${R2_BUCKET}
            STORAGE_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
            STORAGE_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
            STORAGE_FORCE_PATH_STYLE=false
            EOF
            fi
            # Google sign-in (backend redirect flow) — written only when both the
            # client id and secret are set. Callback/redirect are fixed prod URLs.
            if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ]; then
              cat >> .env <<EOF
            GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
            GOOGLE_CALLBACK_URL=https://omniport.online/api/v1/auth/google/callback
            GOOGLE_POST_LOGIN_REDIRECT=https://omniport.online/auth/callback
            EOF
            fi
            docker compose up -d
            docker image prune -f
